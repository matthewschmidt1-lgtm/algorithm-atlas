<script>
  // Apply saved display settings before first paint to avoid a flash of the wrong theme.
  try {
    var s = (JSON.parse(localStorage.getItem('algorithm-atlas:v1') || '{}').settings) || {};
    var r = document.documentElement;
    var forced = new URLSearchParams(location.search).get('theme');
    if (forced === 'dark' || forced === 'light') s.theme = forced;
    if (s.theme) r.dataset.theme = s.theme;
    if (s.motion === 'reduce') r.dataset.motion = 'reduce';
    if (s.contrast === 'high') r.dataset.contrast = 'high';
    if (s.textScale) r.style.setProperty('--text-scale', s.textScale);
  } catch (e) {}
</script>
