<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Share image source</title>
<!-- Source for assets/og-image.png (1200 x 630), the picture shown when a link to the site is shared.
     To regenerate: serve the project folder, then screenshot /tools/og-image-source.html at exactly
     1200 x 630 in headless Chrome and save it as assets/og-image.png. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #F4F0E7; color: #292D27; }
  .frame { position: absolute; inset: 28px; border: 1px solid rgba(41, 45, 39, 0.3); }
  .text { position: absolute; left: 76px; top: 70px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 600 28px 'Source Serif 4', Georgia, serif; letter-spacing: -0.01em; }
  .eyebrow { margin-top: 74px; font: 600 15px Inter, sans-serif; letter-spacing: 0.15em; text-transform: uppercase; color: #34483B; }
  h1 { margin: 18px 0 0; font: 500 70px/1.04 'Source Serif 4', Georgia, serif; letter-spacing: -0.022em; }
  h1 em { color: #34483B; }
  .tag { position: absolute; left: 76px; bottom: 66px; font: italic 400 25px 'Source Serif 4', Georgia, serif; color: #4C5248; }
  svg.map { position: absolute; right: 28px; top: 28px; }
</style>
</head>
<body>
<svg class="map" width="560" height="574" viewBox="0 0 560 574" fill="none" id="map"></svg>
<div class="frame"></div>
<div class="text">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="40" height="40" fill="none"><g stroke="#34483B" stroke-width="1.5" stroke-linecap="round"><path d="M16 3.5c6.6 0 12.5 5 12.5 12.3S22.8 28.5 16 28.500 3.500 22.900 3.500 16 9.400 3.500 16 3.500z" opacity=".45"/><path d="M16.300 9c3.900 0 7.100 3 7.100 6.900s-3.100 7.100-7.300 7.100-7.100-3.200-7.100-7 3.400-7 7.300-7z" opacity=".75"/></g><circle cx="16" cy="16" r="2.600" fill="#B86F52"/></svg>
    Algorithm Atlas
  </div>
  <p class="eyebrow">The science of solving problems</p>
  <h1>Every Algorithm Has a <em>Universe</em> Behind It.</h1>
</div>
<p class="tag">An interactive field guide to algorithms.</p>
<script>
  // A few contour hills joined by dotted routes, in the manner of the site's universe map.
  const svg = document.getElementById('map');
  const hills = [[150, 150, 62, '#34483B', 1.1], [392, 118, 50, '#C29A4C', 2.3], [300, 312, 84, '#B86F52', 0.4], [128, 420, 54, '#66765A', 3.1], [440, 452, 66, '#8A3F2A', 5.0], [470, 270, 38, '#34483B', 4.2]];
  const routes = [[0, 1], [0, 2], [1, 2], [2, 3], [2, 4], [1, 5], [5, 4], [0, 3]];
  let out = '';
  for (let x = 0; x <= 560; x += 70) out += `<line x1="${x}" y1="0" x2="${x}" y2="574" stroke="rgba(41,45,39,.07)"/>`;
  for (let y = 0; y <= 574; y += 70) out += `<line x1="0" y1="${y}" x2="560" y2="${y}" stroke="rgba(41,45,39,.07)"/>`;
  for (const [a, b] of routes) {
    const A = hills[a], B = hills[b], mx = (A[0] + B[0]) / 2, my = (A[1] + B[1]) / 2, dx = B[0] - A[0], dy = B[1] - A[1];
    out += `<path d="M${A[0]} ${A[1]}Q${mx - dy * 0.1} ${my + dx * 0.1} ${B[0]} ${B[1]}" stroke="rgba(41,45,39,.42)" stroke-dasharray="2 6" stroke-linecap="round"/>`;
  }
  for (const [cx, cy, R, col, ph] of hills) {
    const rings = Math.round(R / 13);
    for (let j = 0; j < rings; j++) {
      const rj = R * (0.28 + 0.72 * ((j + 1) / rings));
      let d = '';
      for (let k = 0; k <= 72; k++) {
        const th = (k / 72) * Math.PI * 2;
        const r = rj * (1 + 0.075 * Math.sin(3 * th + ph + j * 0.5) + 0.045 * Math.sin(5 * th + ph * 2));
        d += `${k ? 'L' : 'M'}${(cx + r * Math.cos(th)).toFixed(1)} ${(cy + r * Math.sin(th) * 0.9).toFixed(1)}`;
      }
      out += `<path d="${d}Z" stroke="${col}" stroke-width="1.2" opacity="${(0.9 - 0.5 * (j / rings)).toFixed(2)}" ${j === rings - 1 ? `fill="${col}" fill-opacity=".05"` : ''}/>`;
    }
    out += `<circle cx="${cx}" cy="${cy}" r="3.6" fill="${col}"/>`;
    const n = Math.round(R / 9);
    for (let i = 0; i < n; i++) {
      const th = ph + (i / n) * Math.PI * 2, rr = R + 18;
      const x = cx + rr * Math.cos(th), y = cy + rr * Math.sin(th) * 0.9;
      out += `<line x1="${(cx + (x - cx) * 0.78).toFixed(1)}" y1="${(cy + (y - cy) * 0.78).toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="rgba(41,45,39,.4)"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.2" fill="#F4F0E7" stroke="${col}" stroke-width="1.4"/>`;
    }
  }
  svg.innerHTML = out;
</script>
</body>
</html>
